[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulate-2048"
version = "0.1.0"
description = "Explore reinforcement learning with 2048 Game"
authors = [{ name = "Kone Abdallah Hakim", email = "konehakim@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    # JAX ecosystem for MCTS and training. CPU wheels by default; see the `gpu` extra.
    "jax>=0.12",
    "flax>=0.12.10",
    "optax>=0.2.8",
    "mctx>=0.0.71",
    "orbax-checkpoint>=0.12.8",
]

[project.optional-dependencies]
# CUDA 12 wheels for RunPod GPU pods: `uv sync --extra gpu`.
gpu = ["jax[cuda12]>=0.12; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyrefly>=1.4",
    "pytest>=9.1",
    # Manual play window and notebooks.
    "matplotlib>=3.11",
    "jupyterlab>=4.6",
]

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PLC0415",  # import-outside-top-level
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["twentyfortyeight", "reinforce"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyrefly]
project_includes = ["twentyfortyeight", "reinforce", "tests"]
python_version = "3.12"

[tool.hatch.build.targets.wheel]
packages = ["twentyfortyeight", "reinforce"]
